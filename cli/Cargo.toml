[package]
name = "feather-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
feather-core = { path = "../core" }
tokio = { version = "1.36", features = ["full", "sync"] }
warp = "0.3"
futures-util = "0.3"
notify = "6.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
flate2 = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
qr2term = "0.3"
local-ip-address = "0.6"
tree-sitter = "0.22.6"
tree-sitter-kotlin = "0.3.8"
pest = "2.8.6"
pest_derive = "2.8.6"
flexbuffers = "25.12.19"
ring = "0.17"
base64 = "0.22.1"
flatbuffers = "24.3.25"

qrcode = { version = "0.13", default-features = false, features = ["svg"] }
