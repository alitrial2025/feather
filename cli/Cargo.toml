[package]
name = "feather-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
feather-core = { path = "../core" }
tokio = { version = "1.36", features = ["full", "sync"] }
warp = "0.3"
futures-util = "0.3"
notify = "6.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.1", features = ["derive"] }
qr2term = "0.3"
local-ip-address = "0.6"
