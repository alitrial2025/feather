[package]
name = "feather-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.27.1", features = ["cli"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
thiserror = "2.0.18"
wasmi = "1.0.9"
wasm-encoder = "0.202"
wasmparser = "0.202"
walrus = "0.26.1"
ring = "0.17"
flexbuffers = "25.12.19"
base64 = "0.22.1"
flatbuffers = "24.3.25"

rquickjs = { version = "0.14", features = ["parallel"] }

# Generate mobile bindings against the selected NDK/Apple SDK headers;
# borrowing a desktop ABI would be incorrect.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs-sys = { version = "0.14", features = ["bindgen"] }

[dev-dependencies]
wat = "1.249.0"
