[package]
name = "feather-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uniffi = { version = "0.27.1", features = ["cli"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"], default-features = false }
thiserror = "2.0.18"
wasmi = "1.0.9"
wasm-encoder = "0.202"
wasmparser = "0.202"
walrus = "0.26.1"

[dev-dependencies]
wat = "1.249.0"
